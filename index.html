<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kebab Dara Mobile</title>
<meta name="description" content="Sistem operasional Kebab Dara">
<meta name="theme-color" content="#B91C1C">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kebab Dara">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{box-sizing:border-box}html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 30% 20%,#EF4444,#B91C1C 45%,#7F1D1D);display:grid;place-items:center;text-align:center;padding:24px}
  .box{max-width:420px;width:100%}
  .logo{width:150px;height:150px;border-radius:34px;box-shadow:0 14px 32px rgba(0,0,0,.35);animation:f 2s ease-in-out infinite}
  @keyframes f{50%{transform:translateY(-6px)}}
  h1{margin:18px 0 4px;font-size:28px}p{margin:0;opacity:.9}
  .btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:16px;border:0;font-size:17px;font-weight:800;cursor:pointer;text-decoration:none}
  .b1{background:#FDE68A;color:#5C1A00}.b2{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.4)}
  .hint{margin-top:16px;font-size:13.5px;opacity:.9;background:rgba(0,0,0,.18);border-radius:14px;padding:12px;text-align:left;line-height:1.5}
  .load{display:none;margin-top:22px}.bar{width:150px;height:4px;border-radius:9px;background:rgba(255,255,255,.25);margin:10px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#FDE68A;border-radius:9px;animation:l 1.1s ease-in-out infinite}@keyframes l{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .app .aksi{display:none}.app .load{display:block}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F4F1EC;opacity:0;transition:opacity .25s;z-index:5}
  #frame.siap{opacity:1}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="icon-512.png" alt="Kebab Dara">
  <h1>Kebab Dara Mobile</h1>
  <p>Sistem Operasional KDG</p>
  <div class="load"><div>Loading...</div><div class="bar"><i></i></div></div>
  <div class="aksi">
    <a class="btn b1" id="buka" href="#">Buka Kebab Dara Mobile</a>
    <button class="btn b2" id="pasang" hidden>📲 Pasang di layar HP</button>
    <div class="hint" id="hint"></div>
  </div>
</div>
<script>
  // ▼ Alamat web app Kebab Dara (Apps Script)
  var APP = 'https://script.google.com/macros/s/AKfycbzwx5suNAw5r_2LS2lvpXvV2Pp-LNtNKnGltKLP8lpxQDDDZXtDz8NE8_7wm7hKcm16/exec?form=menu';
  document.getElementById('buka').href = APP;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || /[?&]app=1/.test(location.search);
  // Selalu periksa versi terbaru aplikasi (tanpa cache browser)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=7', { updateViaCache: 'none' }).then(function (r) { r.update(); }).catch(function () {});
  var VERSI = '7';
  function tambahEmbed(u) { return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'embed=1'; }
  if (standalone) {   // dibuka dari ikon aplikasi → tampil di dalam halaman ini (tanpa bilah alamat)
    document.body.classList.add('app');
    // ===== Halaman disimpan di memori: pindah menu yang sudah pernah dibuka = instan, tanpa loading =====
    var POOL = {}, aktif = null, MAKS = 6, siapPertama = false;
    var css = document.createElement('style');
    css.textContent = '.kdf{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden;opacity:0;transition:opacity .15s}.kdf.aktif.siap{visibility:visible;opacity:1;z-index:5;background:#F4F1EC}';
    document.head.appendChild(css);
    function kunci(u) { var m = String(u).match(/[?&]form=([^&#]*)/); return (m ? decodeURIComponent(m[1]) : 'menu') || 'menu'; }
    function bersih(u) { return String(u).replace(/[?&]embed=1/, ''); }
    function buat(u, k, latar) {
      var fr = document.createElement('iframe');
      fr.className = 'kdf'; fr.title = 'Kebab Dara Mobile'; fr.allow = 'geolocation; camera; microphone; clipboard-write; fullscreen';
      fr.onload = function () { fr.dataset.siap = '1'; siapPertama = true; if (aktif === fr) fr.classList.add('siap'); };
      fr.src = tambahEmbed(u); document.body.appendChild(fr);
      return (POOL[k] = { fr: fr, t: latar ? 0 : Date.now(), url: bersih(u), kotor: false });
    }
    function hapus(k) { var x = POOL[k]; if (!x) return; try { x.fr.remove(); } catch (e) {} delete POOL[k]; }
    function kirim(fr, m) { var x = null; for (var q in POOL) if (POOL[q].fr === fr) x = POOL[q]; try { ((x && x.win) || fr.contentWindow).postMessage(m, '*'); } catch (e) {} }
    function tampil(u) {
      var k = kunci(u), x = POOL[k];
      if (x && (x.kotor || x.url !== bersih(u))) { hapus(k); x = null; }   // sudah dipakai kirim / beda tab → muat ulang
      if (!x) x = buat(u, k);
      Object.keys(POOL).forEach(function (q) { var fr = POOL[q].fr; fr.classList.toggle('aktif', q === k); if (q !== k) fr.classList.remove('siap'); });
      aktif = x.fr; x.t = Date.now();
      if (x.fr.dataset.siap) { x.fr.classList.add('siap'); kirim(x.fr, { kd: 'tampil' }); }
      var urut = Object.keys(POOL).filter(function (q) { return q !== 'menu' && q !== k; }).sort(function (a, b) { return POOL[a].t - POOL[b].t; });
      while (Object.keys(POOL).length > MAKS && urut.length) hapus(urut.shift());
    }
    function dariFrame(src) {   // pesan datang dari bingkai dalam milik Google → telusuri ke atas sampai ketemu iframe kita
      for (var q in POOL) { var w = src, cw = POOL[q].fr.contentWindow;
        for (var i = 0; i < 5 && w; i++) { if (w === cw) { POOL[q].win = src; return q; } try { if (w === w.parent) break; w = w.parent; } catch (e) { break; } } }
      return null; }
    tampil(APP);
    // dibuka dari tautan WA / email / notifikasi: ?f=nama-form → langsung ke form itu (Beranda tetap disiapkan di belakang)
    var fAwal = (location.search.match(/[?&]f=([a-z0-9]+)/i) || [])[1];
    if (fAwal && fAwal !== 'menu') tampil(APP.split('?')[0] + '?form=' + fAwal + ((location.search.match(/[?&]tab=([a-z0-9]+)/i) || [])[1] ? '&tab=' + location.search.match(/[?&]tab=([a-z0-9]+)/i)[1] : ''));
    window.addEventListener('message', function (e) {
      var d = e.data || {}, asal = dariFrame(e.source);
      if (d.kd === 'halo' && asal && POOL[asal].fr === aktif) kirim(aktif, { kd: 'tampil' });
      if (d.kd === 'nav' && /^https:\/\/script\.google\.com\/macros\//.test(d.url)) tampil(d.url);
      if (d.kd === 'kotor' && asal && POOL[asal]) POOL[asal].kotor = true;           // form baru saja dikirim → lain kali dimuat bersih
      if (d.kd === 'keluar') Object.keys(POOL).forEach(function (q) { if (q !== asal) hapus(q); });   // logout → tutup semua halaman lain
      if (d.kd === 'muatDulu' && Array.isArray(d.urls)) d.urls.slice(0, 3).forEach(function (u, i) {
        if (!/^https:\/\/script\.google\.com\/macros\//.test(u) || POOL[kunci(u)]) return;
        setTimeout(function () { if (!POOL[kunci(u)] && Object.keys(POOL).length < MAKS) buat(u, kunci(u), true); }, 2500 + i * 2500);
      });
      if (d.kd === 'notif') tampilNotif(d);
      if (d.kd === 'notifTanya') kirimStatus(e.source);
      if (d.kd === 'notifIzin') mintaIzin(e.source);
    });
    // ===== Notifikasi pop-up (HP & laptop) =====
    function kirimStatus(w) { try { (w || (aktif && aktif.contentWindow)).postMessage({ kd: 'notifStatus', izin: ('Notification' in window) ? Notification.permission : 'tidak-didukung' }, '*'); } catch (e) {} }
    function tampilNotif(d) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var opt = { body: d.body || '', icon: 'icon-192.png', badge: 'favicon.png', tag: d.tag || undefined, renotify: true, data: { url: d.url || '' } };
      if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(function (r) { r.showNotification(d.title || 'Kebab Dara', opt); }).catch(function () { try { new Notification(d.title, opt); } catch (e) {} });
      else { try { new Notification(d.title, opt); } catch (e) {} }
    }
    function mintaIzin(w) {
      if (!('Notification' in window)) { kirimStatus(w); return; }
      if (Notification.permission !== 'default') { kirimStatus(w); return; }
      var b = document.getElementById('izinNotif');
      if (!b) { b = document.createElement('button'); b.id = 'izinNotif'; b.type = 'button'; b.textContent = '🔔 Ketuk untuk mengizinkan notifikasi';
        b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:9999;border:0;border-radius:99px;padding:14px 22px;font:700 15px system-ui,sans-serif;background:#B91C1C;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3)';
        document.body.appendChild(b); }
      b.onclick = function () { Notification.requestPermission().then(function () { b.remove(); kirimStatus(w); }); };
      setTimeout(function () { if (b.parentNode) b.remove(); }, 15000);
    }
    if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', function (e) { var d = e.data || {}; if (d.kd === 'buka' && /^https:\/\/script\.google\.com\/macros\//.test(d.url)) tampil(d.url); });
    // Sinyal lambat: JANGAN keluar dari aplikasi – tampilkan tombol muat ulang di dalam aplikasi
    setTimeout(function () { if (siapPertama) return;
      var b = document.createElement('button'); b.type = 'button'; b.textContent = '↻ Koneksi lambat – ketuk untuk muat ulang';
      b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:9999;border:0;border-radius:99px;padding:14px 22px;font:700 15px system-ui,sans-serif;background:#B91C1C;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3)';
      b.onclick = function () { b.remove(); Object.keys(POOL).forEach(hapus); siapPertama = false; tampil(APP); }; document.body.appendChild(b);
      var t = setInterval(function () { if (siapPertama) { clearInterval(t); b.remove(); } }, 1000); }, 25000);
  } else {
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent), hint = document.getElementById('hint'), btn = document.getElementById('pasang'), ev = null;
    hint.innerHTML = ios
      ? '<b>Pasang di iPhone:</b> ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas) di Safari → <b>Tambah ke Layar Utama</b> → <b>Tambah</b>.'
      : '<b>Pasang di Android:</b> ketuk <b>📲 Pasang di layar HP</b> di atas. Kalau tombolnya tidak muncul: menu <b>⋮</b> Chrome → <b>Tambahkan ke layar utama</b> / <b>Instal aplikasi</b>.';
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ev = e; btn.hidden = false; });
    btn.addEventListener('click', function () { if (!ev) return; ev.prompt(); ev.userChoice.finally(function () { ev = null; btn.hidden = true; }); });
    window.addEventListener('appinstalled', function () { hint.innerHTML = '✅ Terpasang! Buka <b>Kebab Dara</b> dari layar HP kamu.'; btn.hidden = true; });
  }
</script>
</body>
</html>
